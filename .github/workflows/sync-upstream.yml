
name: Sync upstream, build and release PCL

on:
  workflow_dispatch:
    inputs:
      force_release:
        description: "Rebuild and publish the current main commit even if sync found no changes"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.sync_commit.outputs.changed }}
      sha: ${{ steps.sync_commit.outputs.sha }}

    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/Meloong-Git/PCL.git
          git fetch --prune upstream main

      - name: Merge upstream main
        shell: bash
        run: git merge --no-edit upstream/main

      - name: Reapply custom setting
        shell: pwsh
        run: |
          $path = "Plain Craft Launcher 2/Modules/ModSecret.vb"
          if (-not (Test-Path -LiteralPath $path)) {
            throw "Expected source file not found: $path"
          }

          $content = [System.IO.File]::ReadAllText($path)
          $pattern = '(?m)^\s*Public Const RestrictMcDownload As Boolean = (True|False)\s*$'
          $matches = [System.Text.RegularExpressions.Regex]::Matches($content, $pattern)

          if ($matches.Count -ne 1) {
            throw "Expected exactly one RestrictMcDownload declaration, found $($matches.Count)."
          }

          $updated = [System.Text.RegularExpressions.Regex]::Replace(
            $content,
            $pattern,
            'Public Const RestrictMcDownload As Boolean = False',
            1
          )
          [System.IO.File]::WriteAllText(
            $path,
            $updated,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Commit and push if changed
        id: sync_commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Already synchronized; no release will be created."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --cached --stat
          git commit -m "chore: sync upstream and keep unrestricted MC downloads"
          git push origin HEAD:main

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build PCL Release EXE
    runs-on: windows-latest
    needs: sync
    if: needs.sync.outputs.changed == 'true' || inputs.force_release
    permissions:
      contents: read

    steps:
      - name: Checkout synchronized source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 1
          submodules: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Update Help resource
        shell: pwsh
        run: |
          $helpDir = Join-Path $env:RUNNER_TEMP "PCL2Help"
          $helpZip = Join-Path $env:RUNNER_TEMP "Help.zip"
          $resourceDir = Join-Path $env:GITHUB_WORKSPACE "Plain Craft Launcher 2\Resources"

          git clone --depth 1 --branch master https://github.com/LTCatt/PCL2Help.git $helpDir
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone PCL2Help."
          }

          Compress-Archive -Path (Join-Path $helpDir "*") -DestinationPath $helpZip -Force
          if (-not (Test-Path -LiteralPath $helpZip)) {
            throw "Help.zip was not created."
          }

          New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null
          Copy-Item -LiteralPath $helpZip -Destination (Join-Path $resourceDir "Help.zip") -Force
          Remove-Item -LiteralPath $helpDir -Recurse -Force

      - name: Set build metadata and optional public OAuth client ID
        shell: pwsh
        env:
          PCL_MS_CLIENT_ID: ${{ vars.CLIENT_ID }}
          PCL_COMMIT_SHA: ${{ needs.sync.outputs.sha }}
        run: |
          $secretPath = "Plain Craft Launcher 2\Modules\ModSecret.vb"
          $secretContent = [System.IO.File]::ReadAllText($secretPath)
          $oldClient = 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "")'

          if (-not [string]::IsNullOrWhiteSpace($env:PCL_MS_CLIENT_ID)) {
            if (-not $secretContent.Contains($oldClient)) {
              throw "OAuthClientId source line did not match the expected upstream format."
            }
            $newClient = 'Public OAuthClientId As String = If(Environment.GetEnvironmentVariable("PCL_MS_CLIENT_ID"), "' + $env:PCL_MS_CLIENT_ID + '")'
            $secretContent = $secretContent.Replace($oldClient, $newClient)
          }

          [System.IO.File]::WriteAllText(
            $secretPath,
            $secretContent,
            [System.Text.UTF8Encoding]::new($false)
          )

          $basePath = "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
          $baseContent = [System.IO.File]::ReadAllText($basePath)
          $oldHash = 'Public Const CommitHash As String = ""'
          if (-not $baseContent.Contains($oldHash)) {
            throw "CommitHash source line did not match the expected upstream format."
          }
          $newHash = 'Public Const CommitHash As String = "' + $env:PCL_COMMIT_SHA + '"'
          $baseContent = $baseContent.Replace($oldHash, $newHash)

          [System.IO.File]::WriteAllText(
            $basePath,
            $baseContent,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore "PCLCS\PCLCS.csproj"

      - name: Build Release
        shell: pwsh
        run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release

      - name: Prepare EXE only
        shell: pwsh
        run: |
          $builtExe = "Plain Craft Launcher 2\obj\Release\Plain Craft Launcher 2.exe"
          if (-not (Test-Path -LiteralPath $builtExe)) {
            throw "Build succeeded but the expected EXE was not found: $builtExe"
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Copy-Item -LiteralPath $builtExe -Destination "dist\PCL.exe" -Force

      - name: Upload EXE for release job
        uses: actions/upload-artifact@v7
        with:
          name: pcl-exe
          path: dist/PCL.exe
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [sync, build]
    if: needs.sync.outputs.changed == 'true' || inputs.force_release
    permissions:
      contents: write

    steps:
      - name: Download built EXE
        uses: actions/download-artifact@v7
        with:
          name: pcl-exe
          path: release-assets

      - name: Create Release and upload EXE
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_SHA: ${{ needs.sync.outputs.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail

          EXE_PATH="release-assets/PCL.exe"
          test -f "$EXE_PATH"

          SHORT_SHA="${SYNC_SHA:0:7}"
          TAG="auto-${RUN_NUMBER}-${RUN_ATTEMPT}-${SHORT_SHA}"
          TITLE="PCL auto build ${SHORT_SHA}"

          gh release create "$TAG" "$EXE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SYNC_SHA" \
            --title "$TITLE" \
            --notes "Automated PCL build after upstream synchronization.

          Source commit: ${SYNC_SHA}
          This release contains only PCL.exe."
